name: Build MuslimEdu APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your source files
        uses: actions/checkout@v4
        with:
          path: source-files

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create a fresh React Native project
        run: npx @react-native-community/cli@latest init MuslimEdu --package-name com.muslimeduu --skip-install

      - name: Copy your custom app code into the project
        run: |
          rm -rf MuslimEdu/App.tsx
          cp -r source-files/src MuslimEdu/src
          cp source-files/App.tsx MuslimEdu/App.tsx

      - name: Copy gluestack-ui / NativeWind config over the CLI template's own
        run: |
          cp source-files/.npmrc MuslimEdu/.npmrc
          cp source-files/babel.config.js MuslimEdu/babel.config.js
          cp source-files/metro.config.js MuslimEdu/metro.config.js
          cp source-files/tailwind.config.js MuslimEdu/tailwind.config.js
          cp source-files/nativewind-env.d.ts MuslimEdu/nativewind-env.d.ts

      - name: Copy your app icon over the default one
        run: cp -r source-files/android-icons/* MuslimEdu/android/app/src/main/res/

      - name: Lock the app to portrait orientation
        run: sed -i '/android:name=".MainActivity"/a\      android:screenOrientation="portrait"' MuslimEdu/android/app/src/main/AndroidManifest.xml

      - name: Enable New Architecture (required by react-native-reanimated v4)
        run: |
          if grep -q '^newArchEnabled=' MuslimEdu/android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=true/' MuslimEdu/android/gradle.properties
          else
            echo 'newArchEnabled=true' >> MuslimEdu/android/gradle.properties
          fi

      - name: Add camera permission for QR/ID scanning
        run: sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.CAMERA" />' MuslimEdu/android/app/src/main/AndroidManifest.xml

      - name: Add storage/media permissions for picking ID/profile photos from the gallery
        run: |
          sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' MuslimEdu/android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' MuslimEdu/android/app/src/main/AndroidManifest.xml

      - name: Add location permissions for GPS-based prayer times
        run: |
          sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' MuslimEdu/android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' MuslimEdu/android/app/src/main/AndroidManifest.xml

      - name: Add notification permission for Android 13+ (Firebase push)
        run: sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' MuslimEdu/android/app/src/main/AndroidManifest.xml

      - name: Copy Firebase config (Cloud Messaging)
        run: cp source-files/android-config/google-services.json MuslimEdu/android/app/google-services.json

      - name: Copy custom fonts
        run: |
          mkdir -p MuslimEdu/android/app/src/main/assets/fonts
          cp source-files/android-fonts/*.ttf MuslimEdu/android/app/src/main/assets/fonts/

      - name: Wire up the Google Services Gradle plugin
        run: |
          sed -i '/classpath("com.facebook.react:react-native-gradle-plugin")/a\        classpath("com.google.gms:google-services:4.4.2")' MuslimEdu/android/build.gradle
          echo 'apply plugin: "com.google.gms.google-services"' >> MuslimEdu/android/app/build.gradle

      - name: Install base dependencies
        working-directory: MuslimEdu
        run: npm install

      - name: Install navigation + feature packages
        working-directory: MuslimEdu
        run: |
          npm install \
            "@react-navigation/native@^7" \
            "@react-navigation/native-stack@^7" \
            "@react-navigation/bottom-tabs@^7" \
            "react-native-screens@^4" \
            "@react-native-async-storage/async-storage@1.23.1" \
            react-native-keychain \
            react-native-svg \
            lucide-react-native@1.31.0 \
            react-native-image-picker \
          "@react-native-documents/picker@12.0.2" \
            react-native-linear-gradient \
            react-native-fs \
            "@bam.tech/react-native-image-resizer" \
            axios \
            "@react-native-async-storage/async-storage" \
            "@react-native-community/datetimepicker" \
            "@react-native-community/netinfo@^11.4.1" \
            "react-native-vision-camera@^4.7.3" \
            "react-native-qrcode-svg@^6.3.21" \
            "react-native-view-shot@^4.0.3" \
            "@react-native-community/geolocation@^3.4.0" \
            "@react-native-firebase/app@^21.6.1" \
            "@react-native-firebase/messaging@^21.6.1"

      - name: Install gluestack-ui (NativeWind v4 / Tailwind v3) packages
        working-directory: MuslimEdu
        run: |
          npm install \
            "@expo/html-elements@^0.12.5" \
            "@gluestack-ui/core@^4.0.0-alpha.0" \
            "@gluestack-ui/utils@^4.0.0-alpha.0" \
            "@legendapp/motion@^2.5.3" \
            "@react-aria/dialog@^3.6.1" \
            "@react-aria/focus@^3.22.1" \
            "@react-aria/interactions@^3.28.1" \
            "@react-aria/ssr@^3.10.1" \
            "@react-aria/utils@^3.34.1" \
            "@react-stately/toggle@^3.10.1" \
            "nativewind@^4.2.6" \
            "react-aria@^3.51.0" \
            "react-dom@19.2.3" \
            "react-native-reanimated@^4.5.3" \
            "react-native-worklets@^0.11.4" \
            "react-stately@^3.49.0" \
            "tailwind-variants@^0.1.20" \
            "babel-plugin-module-resolver@^5.0.3" \
            "tailwindcss@^3.4.19"

      - name: Bundle JavaScript into the APK
        working-directory: MuslimEdu
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build debug APK
        working-directory: MuslimEdu/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: muslimedu-debug-apk
          path: MuslimEdu/android/app/build/outputs/apk/debug/app-debug.apk
